{% extends 'layout/base.html' %}
{% block page_title %}Role Management{% endblock %}
{% block content %}
<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead><tr><th>User</th><th>Current Role</th><th>Assign Role</th></tr></thead>
        <tbody>
        {% for profile in users %}
        <tr><td>{{ profile.user.email }}</td><td>{{ profile.get_role_display }}</td><td>
            <form method="post" action="{% url 'admin_update_user_role' profile.user.id %}" class="d-flex gap-2">
                {% csrf_token %}
                <select name="role" class="form-select" aria-label="Role">
                {% for code, label in role_choices %}
                <option value="{{ code }}" {% if profile.role == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
                </select>
                <button class="btn btn-primary" type="submit" title="Save role"><i class="fas fa-save"></i></button>
            </form>
        </td></tr>
        {% empty %}<tr><td colspan="3">No approved users.</td></tr>{% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
